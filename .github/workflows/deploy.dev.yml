name: Deploy Snowflake Operator - DEV

# ============================================================
# MANUAL TRIGGER ONLY
# Nothing runs automatically when changes are pushed/merged
# to the main branch.
# ============================================================
on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
  EKS_CLUSTER_NAME: ${{ vars.EKS_CLUSTER_NAME }}
  K8S_NAMESPACE: ${{ vars.K8S_NAMESPACE }}

jobs:

  # ============================================================
  # STAGE 1 - VALIDATE GO OPERATOR
  # ============================================================
  validate:
    name: Validate Go Operator
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Check formatting
        run: |
          UNFORMATTED="$(gofmt -l .)"

          if [ -n "$UNFORMATTED" ]; then
            echo "The following Go files are not formatted:"
            echo "$UNFORMATTED"
            echo ""
            echo "Run 'gofmt -w .' locally and commit the changes."
            exit 1
          fi

          echo "All Go files are correctly formatted."

      - name: Go Vet
        run: go vet ./...

      - name: Go Test
        run: go test ./...

      - name: Build Operator
        run: go build ./...

      - name: Validation Summary
        run: |
          echo "### Validation Result" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Go Operator validation completed successfully." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- Formatting: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Go Vet: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Go Test: Passed" >> "$GITHUB_STEP_SUMMARY"
          echo "- Go Build: Passed" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # STAGE 2 - BUILD
  # ============================================================
  build:
    name: Build
    needs: validate
    runs-on: ubuntu-latest
    environment: dev

    # Pass Build Number and Image URI to Deploy DEV
    outputs:
      build_number: ${{ steps.build-info.outputs.build_number }}
      image_uri: ${{ steps.build-info.outputs.image_uri }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # AWS authentication using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify AWS identity
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: aws sts get-caller-identity


      # --------------------------------------------------------
      # Login to Amazon ECR
      # --------------------------------------------------------
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # Generate unique Build Number
      #
      # Format:
      # YYYY.MM.DD-<SeqNum>
      #
      # Example:
      # 2026.09.20-25
      #
      # GITHUB_RUN_NUMBER provides the sequence number.
      # --------------------------------------------------------
      - name: Generate Build Number
        id: build-info
        shell: bash
        run: |
          BUILD_DATE=$(date -u +"%Y.%m.%d")
          BUILD_NUMBER="${BUILD_DATE}-${GITHUB_RUN_NUMBER}"

          ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${BUILD_NUMBER}"

          echo "BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "ECR_REGISTRY=${ECR_REGISTRY}" >> "$GITHUB_ENV"
          echo "IMAGE_URI=${IMAGE_URI}" >> "$GITHUB_ENV"

          echo "build_number=${BUILD_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "image_uri=${IMAGE_URI}" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "BUILD INFORMATION"
          echo "=========================================="
          echo "Build Number : ${BUILD_NUMBER}"
          echo "Image URI    : ${IMAGE_URI}"
          echo "Git SHA      : ${GITHUB_SHA}"
          echo "=========================================="


      # --------------------------------------------------------
      # Build Docker image
      # --------------------------------------------------------
      - name: Build operator image
        run: |
          echo "Building Snowflake Operator image..."
          echo "Build Number: ${BUILD_NUMBER}"
          echo "Image: ${IMAGE_URI}"

          docker build \
            -t "${IMAGE_URI}" \
            .


      # --------------------------------------------------------
      # Push Docker image
      # --------------------------------------------------------
      - name: Push operator image
        run: |
          echo "Pushing image to Amazon ECR..."
          echo "Image: ${IMAGE_URI}"

          docker push "${IMAGE_URI}"


      # --------------------------------------------------------
      # Build Summary
      # --------------------------------------------------------
      - name: Build Summary
        run: |
          echo "### Snowflake Operator Build" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | DEV |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Number | ${BUILD_NUMBER} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Git SHA | ${GITHUB_SHA} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| ECR Image | ${IMAGE_URI} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Build and Push Successful |" >> "$GITHUB_STEP_SUMMARY"


  # ============================================================
  # STAGE 3 - DEPLOY DEV
  # ============================================================
  deploy-dev:
    name: Deploy DEV
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:

      - name: Checkout repository
        uses: actions/checkout@v6


      # --------------------------------------------------------
      # Display Build information received from Build stage
      # --------------------------------------------------------
      - name: Display Build Information
        run: |
          echo "=========================================="
          echo "DEPLOYMENT INFORMATION"
          echo "=========================================="
          echo "Environment  : DEV"
          echo "Build Number : ${{ needs.build.outputs.build_number }}"
          echo "Image URI    : ${{ needs.build.outputs.image_uri }}"
          echo "=========================================="


      # --------------------------------------------------------
      # AWS authentication using GitHub OIDC
      # --------------------------------------------------------
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # Verify AWS identity
      # --------------------------------------------------------
      - name: Verify AWS identity
        run: aws sts get-caller-identity


      # --------------------------------------------------------
      # Configure kubectl for EKS
      # --------------------------------------------------------
      - name: Configure EKS kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region "${AWS_REGION}" \
            --name "${EKS_CLUSTER_NAME}"


      - name: Verify Kubernetes connection
        run: |
          echo "=========================================="
          echo "VERIFY KUBERNETES CONNECTION"
          echo "=========================================="

          kubectl get nodes

          echo ""
          echo "Ensuring namespace exists: ${K8S_NAMESPACE}"

          kubectl create namespace "${K8S_NAMESPACE}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

          echo ""
          kubectl get namespace "${K8S_NAMESPACE}"


      # --------------------------------------------------------
      # Deploy exact image created by Build stage
      # --------------------------------------------------------
      - name: Deploy operator image
        run: |
          echo "Deploying Build:"
          echo "${{ needs.build.outputs.build_number }}"

          echo "Deploying Image:"
          echo "${{ needs.build.outputs.image_uri }}"

          kubectl set image \
            deployment/snowflake-operator \
            operator="${{ needs.build.outputs.image_uri }}" \
            -n "${K8S_NAMESPACE}"


      # --------------------------------------------------------
      # Wait for rollout
      # --------------------------------------------------------
      - name: Wait for operator rollout
        run: |
          kubectl rollout status \
            deployment/snowflake-operator \
            -n "${K8S_NAMESPACE}" \
            --timeout=5m


      # --------------------------------------------------------
      # Display deployed Kubernetes image
      # --------------------------------------------------------
      - name: Verify deployed operator image
        run: |
          kubectl get deployment snowflake-operator \
            -n "${K8S_NAMESPACE}" \
            -o jsonpath='{.spec.template.spec.containers[*].image}'

          echo ""


      # --------------------------------------------------------
      # Apply Snowflake CR
      # --------------------------------------------------------
            # --------------------------------------------------------
      # Apply Snowflake Database CR
      # Capture the CR name automatically
      # --------------------------------------------------------
      - name: Deploy Snowflake database
        id: deploy-database
        run: |
          CR_NAME=$(kubectl apply \
            -f manifests/dev/database.yaml \
            -o name)

          CR_NAME="${CR_NAME##*/}"

          echo "cr_name=${CR_NAME}" >> "$GITHUB_OUTPUT"

          echo "=========================================="
          echo "SNOWFLAKE DATABASE CR DEPLOYED"
          echo "=========================================="
          echo "CR Name: ${CR_NAME}"
          echo "=========================================="


      # --------------------------------------------------------
      # Verify the database CR deployed by THIS pipeline
      # --------------------------------------------------------
      - name: Verify Snowflake Database CR
        run: |
          CR_NAME="${{ steps.deploy-database.outputs.cr_name }}"

          echo "=========================================="
          echo "SNOWFLAKE DATABASE CRs"
          echo "=========================================="

          kubectl get snowflakedatabase \
            -n "${K8S_NAMESPACE}"

          echo ""
          echo "=========================================="
          echo "DEPLOYED DATABASE CR DETAILS"
          echo "=========================================="
          echo "CR Name: ${CR_NAME}"
          echo ""

          kubectl describe snowflakedatabase \
            "${CR_NAME}" \
            -n "${K8S_NAMESPACE}"


      # --------------------------------------------------------
      # Display database deployment status
      # --------------------------------------------------------
      - name: Display Snowflake Database Status
        run: |
          CR_NAME="${{ steps.deploy-database.outputs.cr_name }}"

          DB_NAME=$(kubectl get snowflakedatabase "${CR_NAME}" \
            -n "${K8S_NAMESPACE}" \
            -o jsonpath='{.spec.name}')

          READY=$(kubectl get snowflakedatabase "${CR_NAME}" \
            -n "${K8S_NAMESPACE}" \
            -o jsonpath='{.status.ready}')

          MESSAGE=$(kubectl get snowflakedatabase "${CR_NAME}" \
            -n "${K8S_NAMESPACE}" \
            -o jsonpath='{.status.message}')

          echo ""
          echo "=========================================="
          echo "SNOWFLAKE DATABASE DEPLOYMENT STATUS"
          echo "=========================================="
          echo "CR Name       : ${CR_NAME}"
          echo "Database Name : ${DB_NAME}"
          echo "Ready         : ${READY}"
          echo "Message       : ${MESSAGE}"
          echo "=========================================="


      # --------------------------------------------------------
      # Deployment Summary
      # --------------------------------------------------------
      - name: Deployment Summary
        run: |
          echo "### DEV Deployment" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Property | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Environment | DEV |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Build Number | ${{ needs.build.outputs.build_number }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Image | ${{ needs.build.outputs.image_uri }} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Kubernetes Namespace | ${K8S_NAMESPACE} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Status | Deployment Successful |" >> "$GITHUB_STEP_SUMMARY"


      # --------------------------------------------------------
      # Show operator logs if something failed
      # --------------------------------------------------------
      - name: Operator logs
        if: failure()
        run: |
          kubectl logs \
            -n "${K8S_NAMESPACE}" \
            -l app=snowflake-operator \
            --tail=200
