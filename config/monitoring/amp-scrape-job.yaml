# Merge this job into the scraper configuration used by your AMP/EKS managed collector.
# Exact relabeling can vary with your collector configuration.
- job_name: snowflake-go-operator
  kubernetes_sd_configs:
  - role: endpoints
    namespaces:
      names: [snowflake-system]
  metrics_path: /metrics
  relabel_configs:
  - source_labels: [__meta_kubernetes_service_name]
    action: keep
    regex: snowflake-operator-metrics
  - source_labels: [__meta_kubernetes_endpoint_port_name]
    action: keep
    regex: metrics
