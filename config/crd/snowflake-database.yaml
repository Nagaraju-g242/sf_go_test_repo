apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition

metadata:
  name: snowflakedatabases.snowflake.example.com

spec:
  group: snowflake.example.com

  names:
    kind: SnowflakeDatabase
    plural: snowflakedatabases
    singular: snowflakedatabase
    shortNames:
      - sfdatabase

  scope: Namespaced

  versions:
    - name: v1alpha1
      served: true
      storage: true

      schema:
        openAPIV3Schema:
          type: object

          properties:
            apiVersion:
              type: string

            kind:
              type: string

            metadata:
              type: object

            spec:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                comment:
                  type: string

            status:
              type: object
              properties:
                ready:
                  type: boolean
                observedGeneration:
                  type: integer
                  format: int64
                message:
                  type: string

      subresources:
        status: {}