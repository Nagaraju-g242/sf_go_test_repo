apiVersion: v1
kind: Pod
metadata:
  name: wif-debug
  namespace: snowflake-system
spec:
  serviceAccountName: snowflake-operator
  containers:
    - name: debug
      image: public.ecr.aws/docker/library/busybox:1.36
      command:
        - sh
        - -c
        - sleep 3600
      volumeMounts:
        - name: snowflake-token
          mountPath: /var/run/secrets/tokens
          readOnly: true
  volumes:
    - name: snowflake-token
      projected:
        sources:
          - serviceAccountToken:
              path: snowflake-token
              expirationSeconds: 3600
              audience: snowflakecomputing.com